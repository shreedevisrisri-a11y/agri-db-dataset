<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri Image Dataset Hub (Unlimited Cloud Storage)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; }
        
        .upload-section { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
        .upload-card { flex: 1; min-width: 280px; background: #eef9f1; border: 2px dashed #2ecc71; padding: 20px; border-radius: 8px; text-align: center; }
        
        input[type="file"] { margin-bottom: 15px; width: 100%; }
        button { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        button:hover { background: #27ae60; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid #e1e8ed; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card p { padding: 10px; margin: 0; font-size: 13px; color: #333; text-align: center; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Agri Image Dataset Hub</h1>
        <p class="subtitle">(Cloud Hosted Images + SQLite URL Storage)</p>
        
        <div class="upload-section">
            <!-- Option 1: Single or Multiple Images -->
            <div class="upload-card">
                <h3>🖼️ Upload Single / Multiple Images</h3>
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <input type="file" name="file" accept="image/*" multiple required><br>
                    <button type="submit">Upload Images</button>
                </form>
            </div>

            <!-- Option 2: Entire Folder -->
            <div class="upload-card">
                <h3>📁 Upload Entire Folder</h3>
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <input type="file" name="file" accept="image/*" webkitdirectory multiple required><br>
                    <button type="submit">Upload Folder</button>
                </form>
            </div>
        </div>

        <!-- Image Gallery -->
        <h2>Dataset Images</h2>
        <div class="gallery">
            {% for img in images %}
                <div class="card">
                    <!-- Cloudinary URL Rendering -->
                    <img src="{{ img.url }}" alt="Dataset Image">
                    <p>{{ img.filename }}</p>
                </div>
            {% else %}
                <p style="grid-column: 1/-1; text-align: center; color: #888;">No images stored in database yet.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
